<style>:root {
  --primary: #3b82f6;
  --primary-dark: #2563eb;
  --primary-light: #dbeafe;
  --primary-bg: #eff6ff;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --text: #111827;
  --text-secondary: #6b7280;
  --text-tertiary: #9ca3af;
  --bg: #f0f7ff;
  --bg-card: #ffffff;
  --border: #e5e7eb;
  --border-light: #f3f4f6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
  color: var(--text);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: var(--bg);
}

button, input, select, textarea { font: inherit; }

button {
  border: 0;
  border-radius: 14px;
  background: var(--border-light);
  color: var(--text);
  padding: 10px 14px;
  cursor: pointer;
  transition: all 0.15s ease;
}

button:active { transform: scale(0.97); }

.app {
  max-width: 520px;
  min-height: 100vh;
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) 16px 100px;
}

/* ===== 顶部栏 ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

.eyebrow { margin: 0 0 4px; color: var(--text-secondary); font-size: 13px; font-weight: 500; }

h1, h2, h3, p { margin-top: 0; }

h1 { margin-bottom: 0; font-size: 22px; letter-spacing: -0.03em; font-weight: 700; }

h2 { font-size: 28px; line-height: 1.2; letter-spacing: -0.03em; font-weight: 800; }

h3 { margin-bottom: 8px; font-size: 16px; font-weight: 600; }

/* ===== 背诵页顶部 ===== */
.learnTop {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.learnTop select {
  flex: 1;
  min-width: 0;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: var(--bg-card);
  color: var(--text);
  padding: 11px 14px;
  outline: none;
  font-weight: 600;
  font-size: 14px;
}

.learnTop select:focus { border-color: var(--primary); }

.progressTag {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  font-weight: 500;
}

.iconBtn {
  flex: 0 0 auto;
  min-width: 48px;
  height: 36px;
  border-radius: 10px;
  background: var(--primary-light);
  color: var(--primary-dark);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 600;
  padding: 0 10px;
  border: 1px solid var(--primary);
}

/* ===== 面板 ===== */
.panel {
  border-radius: 24px;
  background: var(--bg-card);
  box-shadow: var(--shadow);
  padding: 16px;
}

/* ===== 通用控件 ===== */
select, input, textarea {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: var(--bg-card);
  color: var(--text);
  padding: 11px 12px;
  outline: none;
  transition: border-color 0.15s;
}

select:focus, input:focus, textarea:focus { border-color: var(--primary); }

textarea { min-height: 160px; resize: vertical; line-height: 1.6; }

/* ===== 分段控件 ===== */
.segmented {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 16px;
  background: var(--border-light);
  margin-bottom: 12px;
}

.segmented button {
  flex: 1;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  padding: 8px 6px;
  border-radius: 12px;
  font-weight: 500;
}

.segmented .active {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
  font-weight: 600;
}

/* ===== 进度条 ===== */
.progressBar {
  margin-bottom: 12px;
  padding: 16px 18px;
  border-radius: 20px;
  background: var(--bg-card);
  border: 1px solid rgba(59, 130, 246, 0.08);
  box-shadow: 0 2px 12px rgba(59, 130, 246, 0.04);
}

.progressTrack {
  height: 10px;
  border-radius: 5px;
  background: var(--primary-light);
  overflow: hidden;
  margin-bottom: 10px;
}

.progressFill {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  transition: width 0.4s ease;
  box-shadow: 0 1px 6px rgba(59, 130, 246, 0.3);
}

.progressInfo {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}

/* ===== 答题卡片 ===== */
.card {
  min-height: 380px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 24px 20px;
  border-radius: 28px;
  background: var(--bg-card);
  box-shadow: 0 2px 20px rgba(59, 130, 246, 0.08), 0 8px 30px rgba(0,0,0,0.04);
  border: 1px solid rgba(59, 130, 246, 0.06);
}

.cardMeta, .stats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13px;
}

.questionArea {
  text-align: center;
  padding: 20px 0 16px;
}

.questionArea h2 {
  font-size: 36px;
  letter-spacing: -0.04em;
  margin-bottom: 6px;
  color: var(--text);
}

.phoneticText {
  font-size: 16px;
  color: var(--text-tertiary);
  margin: 4px 0 10px;
  font-style: italic;
  letter-spacing: 0.02em;
}

.phoneticSmall {
  font-size: 11px;
  color: var(--text-tertiary);
  font-style: italic;
}

.sound {
  align-self: flex-start;
  background: var(--primary-bg);
  color: var(--primary-dark);
  border-radius: 12px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
}

/* ===== 选项按钮 ===== */
.options {
  display: grid;
  gap: 10px;
  flex: 1;
}

.options button {
  text-align: left;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 18px;
  padding: 15px 18px;
  font-size: 16px;
  line-height: 1.4;
  color: var(--text);
  font-weight: 500;
  transition: all 0.2s ease;
}

.options button:hover {
  border-color: var(--primary);
  background: var(--primary-bg);
  box-shadow: 0 2px 12px rgba(59, 130, 246, 0.08);
}

.options .right {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary-dark);
  font-weight: 700;
}

.options .wrong {
  background: var(--danger-light);
  border-color: var(--danger);
  color: #991b1b;
  font-weight: 600;
}

.options .right, .options .wrong { pointer-events: none; }

/* ===== 答题后详情 ===== */
.answerBox {
  border-radius: 18px;
  background: var(--primary-bg);
  border: 1px solid rgba(59, 130, 246, 0.2);
  padding: 16px;
}

.answerBox h3 {
  color: var(--primary-dark);
  font-size: 18px;
}

.answerActions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

/* ===== 底部导航按钮 ===== */
.navButtons {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  margin-top: auto;
  flex-shrink: 0;
}

.navBtn {
  border-radius: 14px;
  padding: 14px;
  font-size: 14px;
  background: var(--border-light);
  color: var(--text-secondary);
  font-weight: 500;
}

.navBtn:hover { background: var(--border); }

.autoJumpBtn {
  background: var(--primary) !important;
  color: white !important;
  animation: pulse 1.5s ease-in-out infinite;
  box-shadow: 0 2px 12px rgba(59, 130, 246, 0.35);
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.85; transform: scale(0.98); }
}

.skipBtn {
  background: var(--warning-light);
  color: #92400e;
  font-weight: 500;
}

/* ===== 词性/频率标签 ===== */
.freqTag {
  display: inline-block;
  border: 1.5px solid var(--primary);
  border-radius: 999px;
  padding: 3px 8px;
  font-weight: 600;
  font-size: 11px;
  color: var(--primary);
}

.posTag {
  display: inline-block;
  border-radius: 8px;
  padding: 3px 8px;
  font-weight: 600;
  font-size: 11px;
}

.masteredTag {
  background: var(--primary-light);
  color: var(--primary-dark);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
}

/* ===== 词库页 ===== */
.libraryHeader {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin-bottom: 10px;
}

.searchInput {
  margin-bottom: 10px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 10px 14px;
  background: var(--bg);
}

.searchInput:focus {
  border-color: var(--primary);
  background: var(--bg-card);
}

/* ===== 筛选居中行 ===== */
.typeFilterRow {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 10px;
}

.typeFilterBtn {
  flex: 0 0 auto;
  border-radius: 999px;
  padding: 7px 20px;
  font-size: 14px;
  background: var(--border-light);
  color: var(--text-secondary);
  border: 1px solid transparent;
  font-weight: 500;
}

.typeFilterBtn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary-dark);
  font-weight: 600;
}

.posFilterRow {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 0 10px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.posFilterRow::-webkit-scrollbar { display: none; }

.posFilterBtn {
  flex-shrink: 0;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 13px;
  background: var(--border-light);
  color: var(--text-secondary);
  border: 1px solid transparent;
  font-weight: 500;
}

.posFilterBtn.active {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
}

/* ===== 列表 ===== */
.list { display: grid; gap: 8px; margin-top: 8px; }

.listItem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px;
  background: var(--bg-card);
  transition: box-shadow 0.15s, border-color 0.15s;
}

.listItem:active { border-color: var(--primary); box-shadow: 0 2px 12px rgba(59, 130, 246, 0.12); }

.listItemMain { flex: 1; min-width: 0; }

.listItemTitle {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}

.listItemTitle h3 { margin: 0; font-size: 15px; }

.listItem p { margin: 0; color: var(--text-secondary); font-size: 14px; }

.listItem small { color: var(--text-tertiary); font-size: 12px; }

.listActions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.smallBtn {
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 12px;
  background: var(--border-light);
  color: var(--text-secondary);
  font-weight: 500;
}

.primary, .next {
  width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  padding: 15px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
  border: none;
}

.next { margin-top: auto; }

.dangerGhost {
  background: var(--danger-light);
  color: var(--danger);
  border: 1px solid #fecaca;
}

.masterBtn {
  background: var(--primary-light);
  color: var(--primary-dark);
  border: 1px solid rgba(59, 130, 246, 0.3);
  font-weight: 600;
}

.fullWidth { width: 100%; }

.muted, .importBox p, .status {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-line;
  word-break: break-all;
  overflow-wrap: break-word;
}

.points p, .examples p {
  margin-bottom: 6px;
  line-height: 1.6;
  font-size: 14px;
}

.examples {
  border-top: 1px solid var(--border);
  margin-top: 8px;
  padding-top: 8px;
  color: var(--text-secondary);
}

.examplePair {
  margin-bottom: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--border-light);
}
.exampleEn {
  margin: 0 0 3px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text);
}
.exampleZh {
  margin: 0;
  font-size: 0.85em;
  color: var(--text-tertiary);
  line-height: 1.5;
}
.exampleZhInline {
  font-size: 0.82em;
  color: var(--text-tertiary);
  margin-left: 6px;
}

.empty {
  border-radius: 18px;
  background: var(--bg);
  padding: 24px;
  color: var(--text-tertiary);
  text-align: center;
  font-size: 14px;
}

/* ===== 弹窗 ===== */
.modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  display: grid;
  place-items: center;
  z-index: 100;
  padding: 20px;
}

.modalContent {
  background: var(--bg-card);
  border-radius: 24px;
  padding: 20px;
  max-width: 460px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.modalHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.closeBtn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--border-light);
  display: grid;
  place-items: center;
  padding: 0;
  font-size: 14px;
}

.modalActions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

/* ===== 详情弹窗增强样式 ===== */
.detailMetaRow {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.detailPosTag {
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 0.82em;
  font-weight: 600;
}
.detailFreqTag {
  font-size: 0.78em;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 8px;
  background: var(--bg-tertiary);
}
.detailMasteredTag {
  font-size: 0.78em;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 8px;
  background: #16a34a15;
  color: #16a34a;
}
.detailMeaning {
  font-size: 1.05em;
  margin-bottom: 12px;
}
.detailSection {
  margin-top: 14px;
  padding: 12px;
  border-radius: 14px;
  background: var(--bg-tertiary);
}
.detailSectionTitle {
  font-weight: 700;
  font-size: 0.88em;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.detailPointItem {
  font-size: 0.85em;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 4px;
  padding-left: 8px;
  border-left: 2px solid var(--border);
}
.detailCollocationItem {
  font-size: 0.85em;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 4px;
}
.detailFormGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.detailFormItem {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  background: var(--bg-card);
  border-radius: 8px;
  font-size: 0.82em;
}
.detailFormLabel {
  color: var(--text-tertiary);
  font-size: 0.9em;
  white-space: nowrap;
}
.detailFormValue {
  font-weight: 600;
  color: var(--text);
}
.detailTagWrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.detailDerivTag {
  padding: 4px 10px;
  border-radius: 10px;
  background: #16a34a12;
  color: #16a34a;
  font-size: 0.82em;
  font-weight: 500;
  transition: background 0.15s, transform 0.1s;
}
.detailDerivTag:hover { background: #16a34a25; }
.detailDerivTag:active { transform: scale(0.95); }
.detailSynonymTag {
  padding: 4px 10px;
  border-radius: 10px;
  background: #2563eb12;
  color: #2563eb;
  font-size: 0.82em;
  font-weight: 500;
  transition: background 0.15s, transform 0.1s;
}
.detailSynonymTag:hover { background: #2563eb25; }
.detailSynonymTag:active { transform: scale(0.95); }
.detailAntonymTag {
  padding: 4px 10px;
  border-radius: 10px;
  background: #ef444412;
  color: #ef4444;
  font-size: 0.82em;
  font-weight: 500;
  transition: background 0.15s, transform 0.1s;
}
.detailAntonymTag:hover { background: #ef444425; }
.detailAntonymTag:active { transform: scale(0.95); }
.detailFormValue { transition: color 0.15s; }
.detailFormValue:hover { color: var(--primary); }
.detailCollocationItem { transition: color 0.15s; }
.detailCollocationItem:hover { color: var(--primary); }
.detailFamilyBtn {
  padding: 4px 10px;
  border-radius: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 0.82em;
  color: var(--text);
  cursor: pointer;
}
.detailFamilyBtn small {
  color: var(--text-tertiary);
  margin-left: 2px;
}

/* 易混词按钮 - 橙色警示风格，区别于关联词族 */
.detailConfusingBtn {
  padding: 4px 10px;
  border-radius: 10px;
  background: #f59e0b12;
  border: 1px solid #f59e0b40;
  font-size: 0.82em;
  color: #b45309;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.detailConfusingBtn:hover { background: #f59e0b22; }
.detailConfusingBtn:active { transform: scale(0.95); }
.detailConfusingBtn small {
  color: #d97706;
  margin-left: 2px;
}

/* ===== 联网关联词检查 ===== */
.familyCheckBox {
  margin-top: 12px;
  padding: 14px;
  border-radius: 16px;
  background: var(--primary-bg);
  border: 1px solid rgba(59, 130, 246, 0.15);
}
.familyCheckHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}
.familyCheckTitle {
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
}
.familyCheckBtn {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 12px;
  background: var(--primary);
  color: white;
  font-size: 13px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.familyCheckBtn:hover { background: var(--primary-dark); }
.familyCheckBtn:disabled { opacity: 0.6; cursor: not-allowed; }
.familyCheckBtn.checking {
  background: var(--border);
  animation: pulse 1.5s ease-in-out infinite;
}
.familyCheckDesc {
  margin: 0;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.familyCheckStatus {
  margin: 8px 0 0;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--bg-card);
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  border: 1px solid var(--border-light);
}
.familyCheckStatus.active {
  color: var(--primary-dark);
  border-color: rgba(59, 130, 246, 0.2);
}

/* AI标注的关联词样式 */
.aiBadge {
  display: inline-block;
  margin-left: 6px;

.listenSeg {

  flex-wrap: wrap;
  justify-content: flex-end;
}

.listenSeg button {

  border-radius: 10px;

}

.listenSeg button.on {

}

}

.listenPlaylist {

}

.listenPLItem {
  display: flex;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  border-radius: 0;
  background: #fff;
  border-bottom: 1px solid var(--border-light);
  color: var(--text);
}

.listenPLItem:last-child { border-bottom: 0; }

.listenPLItem.on {

}

.listenPLIdx {

  font-size: 11px;
  color: var(--text-tertiary);

}

.listenPLItem.on .listenPLIdx { color: var(--primary-dark); font-weight: 700; }

.listenPLTerm {
  flex: 0 0 auto;
  max-width: 42%;
  font-size: 14px;

  overflow: hidden;

}

  font-size: 12px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ===== 底部Tab栏 ===== */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: max(10px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  width: min(520px, calc(100vw - 16px));
  padding: 6px;
  border: 1px solid rgba(59, 130, 246, 0.12);
  border-radius: 22px;
  background: rgba(240, 247, 255, 0.95);
  box-shadow: 0 -4px 24px rgba(59, 130, 246, 0.08), 0 8px 32px rgba(0,0,0,0.06);
  backdrop-filter: blur(20px);
}

.tabbar button {
  display: grid;
  place-items: center;
  gap: 2px;
  background: transparent;
  color: var(--text-tertiary);
  padding: 6px 2px;
  border-radius: 14px;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.2s;
}

.tabbar .active {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 10px rgba(59, 130, 246, 0.35);
}

.tabIcon { width: 22px; height: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; }

.tabLabel { font-size: 10px; }

/* ===== 响应式 ===== */
@media (max-width: 480px) {
  .app { padding-left: 10px; padding-right: 10px; }
  h2 { font-size: 24px; }
  .tabbar { border-radius: 18px; width: min(100vw - 8px); }
  .tabbar button { font-size: 10px; padding: 6px 2px; }
  .importBtnRow { grid-template-columns: 1fr 1fr; }
  .card { padding: 14px; }
  .questionArea h2 { font-size: 30px; }
}

@media (max-width: 390px) {
  .app { padding-left: 8px; padding-right: 8px; }
  h2 { font-size: 22px; }
  .compareTitle { font-size: 22px; }
  .tabbar { gap: 1px; padding: 4px; }
  .tabIcon { width: 20px; height: 20px; }
}

/* ===== 翻译笔等窄长屏适配（宽度≤360px） ===== */
@media (max-width: 360px) {
  body { min-width: 0; }
  .app { padding: max(12px, env(safe-area-inset-top)) 8px 90px; max-width: 100%; }
  h1 { font-size: 19px; }
  h2 { font-size: 20px; }
  h3 { font-size: 15px; }
  .card { padding: 12px; }
  .questionArea h2 { font-size: 24px; }
  .topbar { gap: 8px; margin-bottom: 10px; }
  .learnTop { gap: 6px; margin-bottom: 10px; }
  .multiBookBtn { padding: 9px 10px; font-size: 13px; border-radius: 12px; }
  button { padding: 9px 11px; font-size: 13px; border-radius: 12px; }
  .tabbar {
    width: calc(100vw - 6px);
    padding: 4px 2px;
    gap: 0;
    border-radius: 16px;
    bottom: max(6px, env(safe-area-inset-bottom));
  }
  .tabbar button { font-size: 9px; padding: 5px 1px; gap: 1px; }
  .tabIcon { width: 18px; height: 18px; }
  .bookPickerDropdown { max-height: 45vh; padding: 6px; border-radius: 12px; }
  .bookPickerItem { font-size: 13px; }
  .bookPickerActions button { padding: 6px 10px; font-size: 12px; }
  .modalContent { border-radius: 16px; }
  .detailSectionTitle { font-size: 14px; }
  .posFilterRow button { padding: 5px 9px; font-size: 12px; }
  .searchInput { padding: 9px 12px; font-size: 14px; }
  .options { gap: 8px; }
  .options button { padding: 12px 14px; font-size: 14px; border-radius: 14px; }
  .navBtn { padding: 11px; font-size: 13px; }
  /* 听读页窄屏压缩 */
  .listenFilterRow button { font-size: 11px; padding: 7px 2px; margin-right: 4px; }
  .listenCard { padding: 16px 12px 12px; border-radius: 20px; }
  .listenArt { width: 64px; height: 64px; font-size: 28px; margin-bottom: 10px; }
  .listenWord { font-size: 24px; }
  .listenMeaning { font-size: 13px; }
  .listenPlayBtn { width: 56px; height: 56px; margin: 0 18px; font-size: 21px; }
  .listenSkipBtn { width: 42px; height: 42px; font-size: 17px; }
  .listenChips button { padding: 6px 9px; font-size: 11px; margin-right: 5px; }
  .listenSettingRow > span { font-size: 12px; }
  .listenSeg button { padding: 5px 8px; font-size: 11px; margin-left: 4px; }
  .listenPlaylist { max-height: 240px; }
  .listenPLTerm { font-size: 13px; }
  .listenPLMeaning { font-size: 11px; }
}

/* 超窄屏（≤320px）进一步压缩 */
@media (max-width: 320px) {
  .app { padding-left: 6px; padding-right: 6px; }
  h2 { font-size: 18px; }
  .tabbar button { font-size: 8px; }
  .tabIcon { width: 16px; height: 16px; }
  button { padding: 8px 9px; font-size: 12px; }
}

/* ===== 多词库选择 ===== */
.multiBookBtn {

  padding: 11px 14px;
  border-radius: 14px;
  background: var(--bg-card);

  font-weight: 600;
  font-size: 14px;
  color: var(--text);

}

.bookPickerDropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 100;
  max-height: 300px;
  overflow-y: auto;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);

}

.bookPickerActions {

.bookCount {

/* ===== 易混词辨析 ===== */
.confusingPairItem {

}

}
.confusingNote {

/* ===== 情景记忆 ===== */

}

.sceneWord {

.sceneWordMeaning {

}

.sceneText {

/* ===== 情景记忆分页 ===== */
.scenePagination {

  justify-content: center;

.scenePageBtn {
  padding: 8px 18px;
  border-radius: 14px;

.scenePageDots {

.scenePageDot {

/* ===== 单词用法详情 ===== */
.usageSection {
  padding: 12px 16px;
  background: var(--bg);
  border-radius: 12px;
  margin: 8px 0;
}

.usageSection h4 {
  font-size: 14px;
  color: var(--primary-dark);
  margin-bottom: 6px;
}

.usagePattern {
  display: inline-block;
  padding: 4px 10px;

  background: var(--primary-light);

}

/* ===== 拼写纠错 ===== */
.spellingList {
  display: grid;
  gap: 10px;
  margin-top: 10px;
}

.spellingCard {
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  background: var(--bg);
}

.spellingRow {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.spellingCorrect {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary-dark);
}

.spellingWrong {
  font-size: 15px;
  color: var(--danger);
  text-decoration: line-through;
  font-weight: 500;
}

.spellingTip {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  padding: 8px;
  border-radius: 10px;
  background: var(--primary-bg);
}

/* ===== 更新公告弹窗 ===== */
.updateOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  z-index: 1000;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.updateModal {
  background: var(--bg-card);
  border-radius: 20px;
  max-width: 400px;
  width: 100%;
  max-height: 80vh;
  overflow: hidden;
  box-shadow: 0 25px 80px rgba(0,0,0,0.3);
  animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.updateModalHeader {
  background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
  color: white;
  padding: 24px 20px 20px;
  text-align: center;
  position: relative;
}

.updateModalIcon {
  font-size: 40px;
  margin-bottom: 8px;
}

.updateModalTitle {
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 4px;
}

.updateModalSub {
  font-size: 13px;
  opacity: 0.9;
  margin: 0;
}

.updateModalVersion {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  background: rgba(255,255,255,0.2);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 15px;
  font-weight: 700;
}

.updateModalBadge {
  background: #f59e0b;
  color: white;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 700;
}

.updateModalBody {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.updateModalBody h4 {
  font-size: 14px;
  color: var(--text-secondary);
  margin: 0 0 12px;
  font-weight: 600;
}

.updateModalList {
  list-style: none;
  margin: 0;
  padding: 0;
}

.updateModalList li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border-light);
}

.updateModalList li:last-child {
  border-bottom: none;
}

.updateModalDot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  margin-top: 8px;
  flex-shrink: 0;
}

.updateModalFooter {
  padding: 16px 20px 20px;
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--border-light);
}

.updateModalFooter .updateBtnPrimary {
  flex: 1;
  background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}

.updateModalFooter .updateBtnPrimary:active {
  transform: scale(0.97);
}

.updateModalFooter .updateBtnGhost {
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 14px;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  cursor: pointer;
  white-space: nowrap;
}

.updateModalFooter .updateBtnGhost:hover {
  color: var(--text-primary);
}

/* ===== v2.62.0 听读模式：音乐播放器式布局 ===== */
.listenCoverRow { display: flex; align-items: center; gap: 14px; width: 100%; }

/* ===== v2.66.0 听读界面美化 ===== */
.listenStatusRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.listenStatusPill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .3px;
  background: rgba(127, 127, 127, .14);
  color: #6b7280;
}

.listenStatusPill::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: .7;
}

.listenStatusPill.live {
  background: rgba(99, 102, 241, .14);
  color: #6366f1;
}

.listenStatusPill.live::before { animation: listenPulse 1.4s ease-in-out infinite; }

@keyframes listenPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .35; transform: scale(.7); }
}

.listenCountPill {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  background: rgba(34, 211, 238, .14);
  color: #0891b2;
}

.listenWord { animation: listenWordIn .34s cubic-bezier(.2, .8, .3, 1); }

@keyframes listenWordIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.listenBuildTip {
  margin-top: 10px;
  padding: 7px 10px;
  border-radius: 10px;
  font-size: 11px;
  line-height: 1.5;
  color: #0891b2;
  background: rgba(34, 211, 238, .1);
  border: 1px dashed rgba(34, 211, 238, .4);
}

/* 播放列表：容器相对定位，保证按容器内偏移居中滚动准确无误 */
.listenPlaylist {
  position: relative;
  padding: 4px;
  background: rgba(127, 127, 127, .05);
}

.listenPLItem {
  border-radius: 10px;
  margin-bottom: 2px;
  border-bottom: 0;
  transition: background .2s ease;
}

.listenPLItem.on {
  background: linear-gradient(90deg, rgba(99, 102, 241, .16), rgba(34, 211, 238, .1));
  box-shadow: inset 3px 0 0 #6366f1;
}

.listenPLItem.on .listenPLTerm { color: #4f46e5; }

.listenPLWave {
  flex: none;
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 13px;
  margin-left: 6px;
}

.listenPLWave i {
  width: 2px;
  height: 100%;
  border-radius: 2px;
  background: #6366f1;
  animation: listenBar 0.9s ease-in-out infinite;
}

.listenPLWave i:nth-child(2) { animation-delay: .15s; }
.listenPLWave i:nth-child(3) { animation-delay: .3s; }

@keyframes listenBar {
  0%, 100% { transform: scaleY(.35); }
  50% { transform: scaleY(1); }
}

.listenPlayBtn { position: relative; }

.listenPlayBtn:not(:disabled)::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px solid rgba(59, 130, 246, .25);
  animation: listenRing 2s ease-out infinite;
  pointer-events: none;
}

@keyframes listenRing {
  0% { opacity: .8; transform: scale(.9); }
  100% { opacity: 0; transform: scale(1.15); }
}

/* ==================================================================
   v2.68.0 UI 统一美化
   —— 听读快捷开关升级为「分段控件」卡片，全局按钮 / 卡片视觉统一
   ================================================================== */

/* 听读快捷开关：白色浮层卡片 + 分段控件，去 emoji 更干净 */
.listenChips {
  display: flex;
  flex-wrap: wrap;
  margin: 10px 0 6px;
  padding: 5px;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
}
.listenChips button {
  flex: 1 1 auto;
  min-width: 54px;
  margin: 2px;
  padding: 8px 10px;
  border-radius: 11px;
  font-size: 12.5px;
  font-weight: 600;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  white-space: nowrap;
  transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
}
.listenChips button:active { background: var(--border-light); }
.listenChips button.on {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.32);
}

/* 参数面板行：统一行高与分隔 */
.listenSettings { box-shadow: var(--shadow-sm); }
.listenSettingRow {
  padding: 7px 0;
  margin-bottom: 0;
  border-bottom: 1px solid var(--border-light);
}
.listenSettingRow:last-of-type { border-bottom: 0; }

/* 分段按钮（listenSeg）统一观感 */
.listenSeg button {
  transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
}
.listenSeg button.on {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.30);
}

/* 百词斩同步卡片 */
.bcSyncBox {
  margin: 12px 0 16px;
  padding: 14px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.08), rgba(59, 130, 246, 0.08));
  border: 1px solid rgba(34, 197, 94, 0.25);
}

/* 全局按钮统一圆角与按压反馈（温和覆盖，不破坏既有布局） */
button.primary, .smallBtn, .fileButton {
  transition: transform 0.12s ease, box-shadow 0.18s ease, background 0.18s ease;
}
button.primary:active, .smallBtn:active, .fileButton:active { transform: scale(0.97); }
button.primary {
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(37, 99, 235, 0.25);
}

/* 听读主卡与音频生成提示条更精致 */
.listenSettings { border-radius: 16px; }
@media (max-width: 360px) {
  .listenChips button { min-width: 48px; padding: 7px 8px; font-size: 11.5px; }
}

/* ==================================================================
   v2.69.0 轮盘选择器 + 快捷开关布局加固
   ================================================================== */

/* 轮盘选择器（v2.70.0 横向版）：左右滑动 + 吸附 */
.wheelPicker {
  position: relative;
  height: 52px;
  overflow: hidden;
  margin: 0 auto;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 15%, #000 85%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 15%, #000 85%, transparent 100%);
}
.wheelHighlight {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 72px;
  transform: translateX(-50%);
  background: var(--primary-light);
  border: 1px solid rgba(37, 99, 235, 0.25);
  border-radius: 12px;
  pointer-events: none;
}
.wheelStrip {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  height: 100%;
  will-change: transform;
}
.wheelItem {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
}
.wheelItem.on { color: var(--primary); font-weight: 800; font-size: 15.5px; }

/* 轮盘行：标签居左，横向轮盘占满剩余宽度（v2.70.0） */
.wheelRow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0;
}
.wheelRowLabel {
  flex: 0 0 auto;
  min-width: 64px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-tertiary, #6b7280);
}
.wheelGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 6px 0 2px;
}
.wheelGrid > .wheelCell:only-child { grid-column: 1 / -1; }
.wheelCell {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  background: var(--bg-tertiary, #f8fafc);
  border: 1px solid var(--border-light);
  border-radius: 14px;
  padding: 8px 6px 4px;
  min-width: 0;
}
.wheelCell > span {
  text-align: center;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-tertiary, #6b7280);
  margin-bottom: 2px;
}
.wheelCell .wheelPicker { height: 52px; }
.wheelCell .wheelItem { font-size: 13.5px; }
.wheelCell .wheelItem.on { font-size: 15px; }

/* 听读快捷开关：grid 3 列固定网格，杜绝旧 WebView 上 flex 崩坏成全屏白块 */
.listenChips {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  margin: 10px 0 6px;
  padding: 5px;
  background: var(--bg-card, #fff);
  border: 1px solid var(--border-light);
  border-radius: 16px;
  box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.06));
  max-width: 100%;
  overflow: hidden;
}
.listenChips button {
  min-width: 0;
  padding: 9px 6px;
  border-radius: 11px;
  font-size: 12.5px;
  font-weight: 600;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
}
.listenChips button:active { background: var(--border-light); }
.listenChips button.on {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.32);
}

/* 语速快捷轮盘卡片 */
.listenSpeedSheet {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: listenWordIn 0.25s ease;
}

/* ================= v2.74.0 统一图标系统 =================
   全应用改用同一套 24×24 线性 SVG，替代此前大小不一、颜色不受控的 emoji。 */
.ic {
  width: 1.15em;
  height: 1.15em;
  display: inline-block;
  vertical-align: -0.145em;
  flex: none;
  margin-right: 0.34em;
  stroke-width: 1.7;
  overflow: visible;
}
.ic:last-child { margin-right: 0; }
.tabIcon .ic, .tabIcon svg { margin-right: 0; width: 100%; height: 100%; }
button .ic, .smallBtn .ic, .navBtn .ic { pointer-events: none; }
.inlineSelectCaret .ic { width: 14px; height: 14px; margin-right: 0; transition: transform .18s ease; }
.inlineSelectCaret .ic.caretUp { transform: rotate(180deg); }
.pickDot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 1.8px solid var(--border, #cbd5e1);
  display: inline-block; flex: none; box-sizing: border-box;
  transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
}
.pickDot.on {
  border-color: var(--primary, #2563eb);
  background: var(--primary, #2563eb);
  box-shadow: inset 0 0 0 3px #fff;
}
/* 列表 / 详情小节标题：图标与文字基线对齐、颜色跟随主题 */
.detailSectionTitle .ic, .listenSettingRow .ic { color: var(--primary, #2563eb); }
.detailSectionTitle { display: flex; align-items: center; gap: 2px; }
/* 听读封面：图标居中 */
.listenCoverArt .ic { margin-right: 0; opacity: .95; }

/* 听读页：系统播放被挡住的提示条（vivo 通知被关时最常见） */
.listenTip.mediaWarn {
  display: flex; align-items: flex-start; gap: 6px;
  color: #92400e; background: #fffbeb; border: 1px solid #fde68a;
  padding: 8px 10px; border-radius: 10px; font-weight: 600;
  line-height: 1.45;
}
.listenTip.mediaWarn .ic { color: #d97706; margin-top: 1px; }
.listenTip { display: flex; align-items: flex-start; gap: 6px; }

/* 系统播放卡片自检（我的 → 版本更新下方） */
.mediaDiagCard {
  margin: 12px 0 0; padding: 12px; border-radius: 12px;
  border: 1px solid var(--border-light, #e2e8f0);
  background: #f8fafc;
  display: flex; flex-direction: column; gap: 8px;
}
.mediaDiagCard.bad { background: #fffbeb; border-color: #fde68a; }
.mediaDiagRow { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.5; }
.mediaDiagRow b { flex: none; font-weight: 600; color: #0f172a; }
.mediaDiagRow span { color: #475569; word-break: break-all; }
.mediaDiagCard.bad .mediaDiagRow span { color: #b45309; font-weight: 600; }
.mediaDiagBtns { display: flex; gap: 8px; flex-wrap: wrap; }

/* 图标尺寸：播放控制 / 下拉箭头 / 导入按钮 */
.listenPlayBtn .ic { width: 26px; height: 26px; margin-right: 0; }
.listenSkipBtn .ic { width: 20px; height: 20px; margin-right: 0; }
.listenMp3Btn .ic { width: 18px; height: 18px; margin-right: 0; }
.multiBookBtn .ic { width: 14px; height: 14px; margin: 0 0 0 4px; }
.aiToggle .ic, .affixToggleBtn .ic { width: 13px; height: 13px; margin-right: 5px; }
.fileButton .ic { width: 18px; height: 18px; margin-right: 6px; }
@media (max-width: 360px) {
  .listenPlayBtn .ic { width: 22px; height: 22px; }
  .listenSkipBtn .ic { width: 18px; height: 18px; }
}

/* ===== v2.76.0 新增：应用内提示卡 / 面板关闭栏 / MP3 参数 / 头像 ===== */

/* 应用内提示卡：替代 window.alert（WebView 会给 alert 加「网址为 file://」原生标题） */
.tipMask {
  position: fixed;
  inset: 0;
  z-index: 9000;
  background: rgba(17, 24, 39, 0.42);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 18px;
  animation: tipFade 0.16s ease-out;
}
@keyframes tipFade { from { opacity: 0; } to { opacity: 1; } }
.tipCard {
  width: 100%;
  max-width: 340px;
  max-height: 72vh;
  display: flex;
  flex-direction: column;
  background: var(--bg-card);
  border-radius: 18px;
  box-shadow: 0 18px 48px rgba(15, 23, 42, 0.28);
  padding: 16px 16px 14px;
  animation: tipPop 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
@keyframes tipPop { from { transform: translateY(10px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
.tipHead {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  color: var(--text);
  margin-bottom: 10px;
}
.tipHead .ic { color: var(--primary); }
.tipBody {
  flex: 1;
  margin: 0;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: inherit;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--text-secondary);
  background: var(--bg);
  border-radius: 12px;
  padding: 10px 12px;
}
.tipOk {
  margin-top: 12px;
  height: 42px;
  border: none;
  border-radius: 12px;
  background: var(--primary);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.tipOk:active { background: var(--primary-dark); }

/* 听读面板通用标题栏：始终吸顶，滚到哪都能一眼看到「完成」退出 */
.sheetHead {
  position: sticky;
  top: -1px;

.sheetClose {

}
.sheetClose:active { background: var(--primary-light); }

/* MP3 参数：数字输入 / 文件名 / 目录 */
.mp3NumRow {

.mp3NameInput {

.mp3Result {

.mp3Result .ic { flex-shrink: 0; margin-top: 2px; }

/* 我的页头像 */
.meAvatarImg {

}

/* v2.76.0：MP3 参数行在 390px 宽度下不挤压 */
.listenSettings .listenSeg button { padding: 5px 9px; font-size: 11.5px; }
.mp3NumRow { flex: 1; justify-content: flex-end; }
.mp3NumRow .muted { font-size: 11.5px; }
.listenSettings .listenSettingRow > span { flex-shrink: 0; }
@media (max-width: 360px) {

.saveDirRow {

/* ===== v2.77.0 ===== */
/* 释义分段：多义项之间拉开可见间距，避免「放纵；放任」首尾相接看着像漏标点 */
.mnList { display: inline; }
.mnItem { display: inline-block; margin-right: 10px; }
.mnItem:last-child { margin-right: 0; }
.listenMeaning .mnItem { margin-right: 14px; }

.offlineVoiceRow { display: flex; align-items: center; gap: 10px; }

.offlineVoiceRow .ovText b { font-size: 13px; }

.offlineVoiceBtns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===== v2.78.0 ===== */

  letter-spacing: .2px;
}
.coreMeaning .mnItem { margin-right: 8px; }

/* ===== v2.80.0 护眼模式（暖色低蓝光）=====
   通过 body.eye-care 覆盖主题色：暖米色背景 + 暖棕文字 + 琥珀主色，
   降低蓝光电刺激，长时间背诵更舒服。仅做单开关，不另做深色。 */
body.eye-care {
  --primary: #c0801f;
  --primary-dark: #9c6312;
  --primary-light: #f3e4c2;
  --primary-bg: #faf1dc;
  --danger: #c0532c;
  --danger-light: #f6dccd;
  --warning: #c9921c;
  --warning-light: #f4e6c4;
  --text: #4a3b28;
  --text-secondary: #8a755a;
  --text-tertiary: #b09a7c;
  --bg: #f4ecd8;
  --bg-card: #fbf4e6;
  --border: #e7dabd;
  --border-light: #f0e6d2;
  --shadow-sm: 0 1px 3px rgba(74,59,40,0.07);
  --shadow: 0 4px 16px rgba(74,59,40,0.10);
  --shadow-lg: 0 8px 30px rgba(74,59,40,0.12);
  background: #f4ecd8;
}
/* 护眼模式下给整屏加一层极淡暖色滤镜，进一步削减蓝光 */
body.eye-care .app {
  background: transparent;
}
body.eye-care::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: rgba(255, 176, 59, 0.06);
  z-index: 9999;
}

</style>
<style>
  /* ============================================================
     v2.79.0 首屏骨架（纯 CSS，零 JS 依赖）
     背景：网页版原来是 3.37MB 单文件，github.io 上要 40s 才出画面，
     用户看到的就是「打不开」。现在页面先出这块静态骨架，
     React 挂载后由 __removeSkeleton() 移除；即使 JS 挂了也有明确反馈。
     三段文案互斥显示，切换靠 animation-delay，不需要定时器脚本：
       0~3s   → 「正在加载词库…」
       3~12s  → 「网络较慢，正在加载…」
       12s 起 → 「加载失败」+ 重试按钮
     隐藏用 visibility 而不只是 opacity，保证 innerText 里也只剩当前这一段。
     ============================================================ */
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #f5f7fb;
  }
  #appSkeleton {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #f5f7fb;
    color: #1f2937;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #appSkeleton .skLogo {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    background: linear-gradient(135deg, #2563eb, #60a5fa);
    color: #fff;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 24px rgba(37, 99, 235, .28);
  }
  #appSkeleton .skName {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  #appSkeleton .skSub {
    font-size: 12.5px;
    color: #6b7280;
  }
  #appSkeleton .skBar {
    width: 132px;
    height: 4px;
    border-radius: 999px;
    background: #e2e8f0;
    overflow: hidden;
  }
  #appSkeleton .skBar i {
    display: block;
    width: 42%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #93c5fd, #2563eb);
    /* 起点可见（0% 时停在滑轨左侧），避免动画尚未开始时进度条"消失" */
    animation: skSlide 1.15s ease-in-out infinite;
  }
  @keyframes skSlide {
    0%   { transform: translateX(0); }
    50%  { transform: translateX(140%); }
    100% { transform: translateX(0); }
  }
  /* 三段状态互斥：同一时刻只有一段可见（visibility:hidden 会同时从 innerText 里消失）。
     同属性上后声明的 animation 在结束后优先，因此 12s 起 skStageOut 会覆盖 3s 的 skStageIn。 */
  #skLoading, #skSlow, #skFail { visibility: hidden; opacity: 0; }
  #skLoading { visibility: visible; opacity: 1; animation: skStageOut 0s linear 3s forwards; }
  #skSlow { animation: skStageIn 0s linear 3s forwards, skStageOut 0s linear 12s forwards; }
  #skFail { animation: skStageIn 0s linear 12s forwards; }
  @keyframes skStageIn { to { visibility: visible; opacity: 1; } }
  @keyframes skStageOut { to { visibility: hidden; opacity: 0; } }
  #skFail { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  /* 极老 WebView / 浏览器不支持 ES module 时，用单文件旧版兜底 */
  #skFail .skLegacy {
    font-size: 12px;
    color: #2563eb;
    text-decoration: underline;
    pointer-events: none;
    animation: skEnable 0s linear 12s forwards;
  }
  #skFail button {
    pointer-events: none;
    animation: skEnable 0s linear 12s forwards;
    padding: 9px 22px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  @keyframes skEnable { to { pointer-events: auto; } }
  #skError {
    display: none;
    max-width: 86vw;
    max-height: 34vh;
    overflow: auto;
    padding: 10px 12px;
    border-radius: 10px;
    background: #fff;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
    text-align: left;
  }
  /* 骨架退场：React 挂载后由脚本加 .skGone */
  #appSkeleton.skGone {
    opacity: 0;
    visibility: hidden;
    transition: opacity .22s ease;
  }
</style>
</head>
<body>
<div id="root"></div>

<div id="appSkeleton">
  <div class="skLogo">英</div>
  <div class="skName">背群英 · 高考词汇</div>
  <div class="skSub" id="skLoading">正在加载词库…</div>
  <div class="skBar"><i></i></div>
  <div class="skSub" id="skSlow">网络较慢，正在加载…</div>
  <div id="skFail">
    <div class="skSub">加载失败，请检查网络后重试</div>
    <button type="button" onclick="location.reload()">重新加载</button>
    <a class="skLegacy" href="../legacy/index.html">打不开？试试旧版单文件</a>
  </div>
  <div id="skError"></div>
</div>

<script nomodule>
  /* 0) 老浏览器兜底：不支持 ES module 的 WebView（部分 Android 7/8 定制机、
        翻译扫描笔）拿不到 type=module 的入口包，直接跳单文件旧版，避免白屏。 */
  (function () { try { location.replace('../legacy/index.html'); } catch (e) {} })();
</script>
<script>
/* 1) 骨架退场（main.jsx 在 createRoot().render() 之后调用） */
window.__removeSkeleton = function () {
  var el = document.getElementById('appSkeleton');
  if (!el) return;
  el.className = 'skGone';
  setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 260);
};

/* 2) 兜底：真出错误时把摘要显示出来，而不是留一片白屏 */
(function () {
  var shown = false;
  function report(kind, msg, extra) {
    try {
      var box = document.getElementById('skError');
      var sk = document.getElementById('appSkeleton');
      if (!box) return;
      if (sk && sk.className !== 'skGone') sk.style.background = '#f5f7fb';
      var text = '[' + kind + '] ' + msg + (extra ? '\n' + extra : '');
      box.style.display = 'block';
      box.textContent = shown ? (box.textContent + '\n' + text) : text;
      shown = true;
      // 出错了就只留「加载失败」这一段，前两段彻底移除，避免「加载中」和「失败」同屏
      ['skLoading', 'skSlow'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) { el.style.animation = 'none'; el.style.display = 'none'; }
      });
      var fail = document.getElementById('skFail');
      if (fail) {
        fail.style.animation = 'none';
        fail.style.visibility = 'visible';
        fail.style.opacity = 1;
        var btn = fail.querySelector('button');
        if (btn) btn.style.pointerEvents = 'auto';
      }
    } catch (e) { /* 兜底函数自己不能再抛错 */ }
  }
  window.addEventListener('error', function (e) {
    var msg = (e && (e.message || (e.error && e.error.message))) || '未知错误';
    var where = e && e.filename ? (e.filename + ':' + e.lineno) : '';
    report('脚本错误', msg, where);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    report('未处理的 Promise', (r && (r.message || r)) || '未知原因', '');
  });
  window.__reportBootError = report;
})();

/* 3) 12s 兜底：CSS 动画在旧 WebView 上不一定生效，这里再用 JS 兜一层，
      保证「加载失败」出现时前两段一定不在，三段文案永远互斥。 */
setTimeout(function () {
  var sk = document.getElementById('appSkeleton');
  if (!sk || sk.className === 'skGone') return;
  ['skLoading', 'skSlow'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) { el.style.animation = 'none'; el.style.display = 'none'; }
  });
  var fail = document.getElementById('skFail');
  if (fail) {
    fail.style.animation = 'none';
    fail.style.visibility = 'visible';
    fail.style.opacity = 1;
    var btn = fail.querySelector('button');
    if (btn) btn.style.pointerEvents = 'auto';
    var legacy = fail.querySelector('.skLegacy');
    if (legacy) legacy.style.pointerEvents = 'auto';
  }
}, 12000);
</script>

<script type="module" src="./assets/main.Z4JLW7EZ.js"></script>
</body>
