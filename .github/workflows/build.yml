name: Build & Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Inject feedback token
        run: |
          if [ -n "${{ secrets.GITEE_FEEDBACK_TOKEN }}" ]; then
            sed -i 's|__FEEDBACK_TOKEN__|${{ secrets.GITEE_FEEDBACK_TOKEN }}|g' src/main.jsx
            echo "Feedback token injected"
          else
            echo "No GITEE_FEEDBACK_TOKEN secret found, feedback will fallback to email"
          fi

      - name: Build web
        run: npm run build

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

      - name: Sync to Android
        run: npx cap sync android

      - name: Build APK with fixed signature
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info \
            -PMYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PMYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
            -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PMYAPP_UPLOAD_STORE_FILE=release-key.jks 2>&1 | tee ../build-log.txt

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload APK to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 scripts/upload_apk.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-vocab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk