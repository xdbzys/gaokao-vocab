name: Build & Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Inject feedback token
        run: |
          if [ -n "${{ secrets.GITEE_FEEDBACK_TOKEN }}" ]; then
            sed -i 's|__FEEDBACK_TOKEN__|${{ secrets.GITEE_FEEDBACK_TOKEN }}|g' src/main.jsx
            echo "Feedback token injected"
          else
            echo "No GITEE_FEEDBACK_TOKEN secret found, feedback will fallback to email"
          fi

      - name: Build web
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

      - name: Sync to Android
        run: npx cap sync android

      - name: Build APK with fixed signature
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.daemon=false'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PMYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PMYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
            -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PMYAPP_UPLOAD_STORE_FILE=release-key.jks 2>&1 | tee ../build-log.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

      - name: Output build log on failure
        if: failure()
        run: |
          echo "## Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 build-log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build-log.txt

      - name: Upload APK to Gitee
        id: upload_gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 scripts/upload_apk.py 2>&1 | tee upload-log.txt

      - name: Show upload log on failure
        if: failure()
        run: |
          echo "## Upload Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat upload-log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat upload-log.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "v2.8.2 Build #${{ github.run_number }}"
          body: |
            ## 高考词汇背诵 v2.8.2
            ### 新功能
            - 开屏更新公告
            - 设置中可开关公告
            - 恢复手动检查更新按钮
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-vocab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk