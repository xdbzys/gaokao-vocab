name: Build & Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # v2.73.0 版本号单一事实来源：
      # 旧流程需要人工同时改 build.gradle / app-update.json / main.jsx 三处，
      # 任何一处漏改都会造成「远端版本号不动 → 客户端永远提示已最新」或
      # 「APK 内版本号与清单不一致 → 客户端下完判为旧包直接丢弃」。
      # 现在由流水线生成一次、三处同步，versionCode 严格单调递增（取 run_number 兜底，
      # 即使提交回写失败也不会倒退）。
      - name: Bump versionCode & sync versionName
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const upd = JSON.parse(fs.readFileSync('app-update.json', 'utf8'));
          const runNo = Number(process.env.GITHUB_RUN_NUMBER || 0);
          const next = Math.max(Number(upd.versionCode || 0) + 1, runNo);
          if (!(next > 0)) throw new Error('invalid versionCode in app-update.json');

          let versionName = '';
          for (const f of ['main.jsx', 'src/main.jsx']) {
            if (!fs.existsSync(f)) continue;
            let src = fs.readFileSync(f, 'utf8');
            const m = /const\s+APP_VERSION\s*=\s*['"]([\d.]+)['"]/.exec(src);
            if (m) versionName = m[1];
            fs.writeFileSync(f, src.replace(/const\s+APP_VERSION_CODE\s*=\s*\d+/, 'const APP_VERSION_CODE = ' + next));
          }
          if (!versionName) versionName = upd.version;
          if (!versionName) throw new Error('cannot resolve versionName');

          upd.version = versionName;
          upd.versionCode = next;
          fs.writeFileSync('app-update.json', JSON.stringify(upd, null, 2) + '\n');

          const gradlePath = 'android/app/build.gradle';
          let g = fs.readFileSync(gradlePath, 'utf8');
          g = g.replace(/versionCode\s+\d+/, 'versionCode ' + next);
          g = g.replace(/versionName\s+"[^"]*"/, 'versionName "' + versionName + '"');
          fs.writeFileSync(gradlePath, g);

          fs.writeFileSync('.build_version.json', JSON.stringify({ version: versionName, versionCode: next }));
          console.log('[version] name=' + versionName + ' code=' + next + ' (run ' + runNo + ')');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      # v2.73.0：app-update.json 的最终版（含 apkSha256 / apkSize）在 APK 构建后写入 dist，
      # 见下方 "Finalize manifests with APK digest"，此处不再提前拷贝。

      # v2.59.0 主流更新方案：版本清单 + gzip 压缩包
      # 软件端先拉约 300 字节的 version.json 比对 versionCode，一致则完全不下载正文。
      # v2.73.0：清单最终内容（含 APK 大小 / SHA-256）改到 APK 构建之后生成，
      # 这里只做 gzip，避免出现「清单里没有 APK 摘要」的空窗。
      - name: Generate gzip bundle
        run: |
          # 注意：.gz 只生成到仓库根，不能放进 dist（dist 会整体拷入 Android assets，
          # 与 index.html 形成 Duplicate resources 导致 APK 构建失败）
          gzip -9 -c dist/index.html > index.html.gz
          echo "--- 体积对比（原始 vs gzip）---"
          ls -la dist/index.html index.html.gz

      - name: Copy dist to Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets
          cp -r dist android/app/src/main/assets/public

      # v2.75.0 官网与软件同步：把本次构建版本的功能简述自动写进官网「更新日志」。
      # 约定见 scripts/sync-site-changelog.js 顶部注释；已存在同版本条目则幂等跳过。
      - name: Sync changelog to official site
        run: node scripts/sync-site-changelog.js

      # 需求：从此往后每次更新同步网页版与官网内容
      # 网页版 = dist/index.html（GitHub Pages 根路径 + 云端热更 web/index.html）
      # 官网   = gaokao-vocab-site/（发布到 Pages 的 /site/ 子路径，含 assets 与隐私政策）
      # 放在 APK assets 拷贝之后，避免官网静态资源被打进 APK
      - name: Sync official site into Pages (/site/)
        run: |
          rm -rf dist/site
          mkdir -p dist/site
          cp -r gaokao-vocab-site/. dist/site/
          mv dist/site/gaokao-vocab-site.html dist/site/index.html
          cp privacy.html dist/site/privacy.html
          echo "Synced official site -> dist/site/index.html"
          ls -la dist/site

      # v2.76.0 第二套网页版：/app/ 与 App 完全一致（同一份构建产物，用访问路径区分能力集合）。
      # 旧的网页版继续留在 Pages 根路径，不删除、不覆盖。
      # 这一步必须放在「拷贝 dist 到 Android assets」之后，否则会把 2MB 的 HTML 再打一份进 APK。
      - name: Build second web app (/app/)
        run: |
          mkdir -p dist/app
          cp dist/index.html dist/app/index.html
          ls -la dist/app
          echo "Second web app ready at /app/"

      - name: Build APK with debug-key.jks (matches distributed versions)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      # v2.73.0 构建后强校验：APK 内的包名 / versionCode / versionName 必须与清单完全一致。
      # 不一致直接让流水线变红，绝不把「清单说 237、包里还是 236」的产物发出去 ——
      # 那正是客户端「下完判为旧包、装完还是旧版本」的源头。
      - name: Verify APK version matches manifest
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then AAPT=$(command -v aapt2 || command -v aapt || true); fi
          if [ -z "$AAPT" ]; then echo "::error::aapt2 未找到，无法校验 APK 版本"; exit 1; fi
          echo "using $AAPT"
          "$AAPT" dump badging "$APK" | head -3 > /tmp/badging.txt || true
          cat /tmp/badging.txt
          node - <<'NODE'
          const fs = require('fs');
          const want = JSON.parse(fs.readFileSync('app-update.json', 'utf8'));
          const bag = fs.readFileSync('/tmp/badging.txt', 'utf8');
          const pkg = /package: name='([^']+)'/.exec(bag);
          const code = /versionCode='(\d+)'/.exec(bag);
          const name = /versionName='([^']*)'/.exec(bag);
          if (!pkg || !code || !name) { console.error('cannot parse badging'); process.exit(1); }
          const fail = [];
          if (pkg[1] !== 'com.gaokao.vocab') fail.push('packageName=' + pkg[1]);
          if (Number(code[1]) !== Number(want.versionCode)) fail.push('versionCode ' + code[1] + ' != manifest ' + want.versionCode);
          if (name[1] !== String(want.version)) fail.push('versionName ' + name[1] + ' != manifest ' + want.version);
          if (fail.length) { console.error('APK/manifest mismatch: ' + fail.join('; ')); process.exit(1); }
          console.log('APK ok: ' + pkg[1] + ' v' + name[1] + ' (' + code[1] + ')');
          NODE

      # 把 APK 的字节级指纹写进清单：客户端下载后可按 SHA-256 拒收任何损坏/被替换的包
      - name: Finalize manifests with APK digest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const apk = 'android/app/build/outputs/apk/release/app-release.apk';
          const buf = fs.readFileSync(apk);
          const sha256 = crypto.createHash('sha256').update(buf).digest('hex');
          const size = buf.length;

          const upd = JSON.parse(fs.readFileSync('app-update.json', 'utf8'));
          upd.apkSize = size;
          upd.apkSha256 = sha256;
          fs.writeFileSync('app-update.json', JSON.stringify(upd, null, 2) + '\n');

          const base = 'https://github.com/xdbzys/gaokao-vocab/releases/latest/download';
          const mf = {
            version: upd.version,
            versionCode: upd.versionCode,
            webUrl: base + '/index.html',
            webGzUrl: base + '/index.html.gz',
            apkUrl: base + '/app-release.apk',
            apkUrlCdn: 'https://cdn.jsdelivr.net/gh/xdbzys/gaokao-vocab@master/gaokao-vocab.apk',
            apkSize: size,
            apkSha256: sha256,
            changelog: (upd.changelog || '').slice(0, 160)
          };
          const s = JSON.stringify(mf, null, 2);
          fs.writeFileSync('version.json', s);
          fs.writeFileSync('dist/version.json', s);
          fs.copyFileSync('app-update.json', 'dist/app-update.json');
          console.log('APK ' + size + ' bytes, sha256=' + sha256);
          NODE
          ls -la android/app/build/outputs/apk/release/app-release.apk version.json dist/version.json dist/app-update.json

      - name: Copy release APK for CDN distribution
        run: cp android/app/build/outputs/apk/release/app-release.apk gaokao-vocab.apk

      - name: Upload APK + web/index.html + app-update.json to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        continue-on-error: true
        run: |
          cd /tmp
          git clone --depth 1 --branch master https://oauth2:${GITEE_TOKEN}@gitee.com/xdbzys/app.git gitee-push 2>/dev/null || git clone --depth 1 https://gitee.com/xdbzys/app.git gitee-push
          cd gitee-push
          mkdir -p web
          cp /home/runner/work/gaokao-vocab/gaokao-vocab/gaokao-vocab.apk gaokao-vocab.apk
          # 用本次构建的 dist（而非仓库 web/），保证云端热更与 APK 内置资源严格同版本
          cp /home/runner/work/gaokao-vocab/gaokao-vocab/dist/index.html web/index.html
          cp /home/runner/work/gaokao-vocab/gaokao-vocab/app-update.json app-update.json
          cp /home/runner/work/gaokao-vocab/gaokao-vocab/version.json version.json
          git config user.name "ci-bot"
          git config user.email "ci@bot.com"
          git add gaokao-vocab.apk web/index.html app-update.json version.json
          VERSION=$(node -p "require('/home/runner/work/gaokao-vocab/gaokao-vocab/app-update.json').version")
          git commit -m "release v${VERSION}: sync APK + web + app-update.json" || echo "no changes"
          git push origin master 2>&1 | tail -5 || echo "push failed"
          echo "APK + web/index.html + app-update.json pushed to Gitee"

      - name: Rename web HTML for release
        run: cp dist/index.html "背群英.html"

      - name: Upload web HTML to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: |
            dist/index.html
            index.html.gz
            version.json
            背群英.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            Auto build from GitHub Actions
            Run #${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-vocab-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      # v2.55.6: Mirror APK + web/index.html into repo for jsDelivr CDN
      # v2.71.0 修复：actions/checkout 默认是分离 HEAD（detached HEAD），
      # 旧步骤直接 `git push` 不带 ref 会静默失败，导致 master 上 jsDelivr 的 APK
      # 一直是陈旧缓存、web/index.html 缺失（301），国内用户只能走被墙/限速的 GitHub Release。
      # 改为从 origin/master 检出独立分支再 push <branch>:master（快进提交），
      # 保证最新 APK + index.html 真正落到 master，jsDelivr/raw 从此服务最新版。
      - name: Mirror APK + web into repo (jsDelivr download source)
        continue-on-error: true
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@bot.com"
          # checkout 会把工作区重置成 origin/master 版本，先备份本次构建的产物与清单
          mkdir -p /tmp/mirror
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/mirror/app-release.apk
          cp dist/index.html /tmp/mirror/index.html
          cp version.json app-update.json /tmp/mirror/
          git fetch origin master
          git checkout -B mirror-sync origin/master
          cp /tmp/mirror/app-release.apk gaokao-vocab.apk
          cp /tmp/mirror/index.html web/index.html
          # version.json / app-update.json 必须一起回写：下次构建从 master 读到的 versionCode
          # 才是本次的值，否则版本号会重复，客户端会认为「没有更新」
          cp /tmp/mirror/version.json version.json
          cp /tmp/mirror/app-update.json app-update.json
          git add -f gaokao-vocab.apk web/index.html version.json app-update.json
          if git diff --cached --quiet; then
            echo "Files unchanged, skip mirror commit"
          else
            git commit -m "chore: mirror APK + web for jsDelivr [skip ci]"
            git push origin mirror-sync:master
          fi

      # 刷新 jsDelivr CDN 缓存
      - name: Purge jsDelivr CDN cache
        continue-on-error: true
        run: |
          sleep 20
          curl -s -m 120 "https://purge.jsdelivr.net/gh/xdbzys/gaokao-vocab@master/gaokao-vocab.apk" || echo "purge failed (non-fatal)"
          curl -s -m 120 "https://purge.jsdelivr.net/gh/xdbzys/gaokao-vocab@master/web/index.html" || echo "purge failed (non-fatal)"
          curl -s -m 120 "https://purge.jsdelivr.net/gh/xdbzys/gaokao-vocab@master/version.json" || echo "purge failed (non-fatal)"

      - name: Copy APK to dist
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          mkdir -p dist/web
          cp dist/index.html dist/web/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
        continue-on-error: true
