name: Build & Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 -c "
import requests, base64, json, sys

TOKEN = '${{ secrets.GITEE_TOKEN }}'
REPO = 'xdbzys/app'
APK_PATH = 'android/app/build/outputs/apk/debug/app-debug.apk'

with open(APK_PATH, 'rb') as f:
    content = base64.b64encode(f.read()).decode()

# Get current SHA
resp = requests.get(f'https://gitee.com/api/v5/repos/{REPO}/contents/gaokao-vocab.apk',
    params={'access_token': TOKEN})
data = resp.json()
sha = data.get('sha', '')

# Upload
if sha:
    r = requests.put(f'https://gitee.com/api/v5/repos/{REPO}/contents/gaokao-vocab.apk',
        params={'access_token': TOKEN},
        json={'access_token': TOKEN, 'content': content, 'message': 'auto build apk', 'sha': sha})
else:
    r = requests.post(f'https://gitee.com/api/v5/repos/{REPO}/contents/gaokao-vocab.apk',
        params={'access_token': TOKEN},
        json={'access_token': TOKEN, 'content': content, 'message': 'auto build apk'})

if r.status_code in (200, 201):
    print('APK uploaded to Gitee successfully!')
else:
    print(f'Upload failed: {r.status_code} {r.text[:200]}')
    sys.exit(1)
"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-vocab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
